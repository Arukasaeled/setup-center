# Setup Center Business Commands Permission Set
"$schema" = "../gen/schemas/permission-schema.json"

[default]
description = "Default business permissions for Setup Center operations"
permissions = [
    "allow-business-commands",
]

[[permission]]
identifier = "allow-business-commands"
description = "Enables typed business commands while explicitly denying arbitrary command execution"
commands.allow = [
    "detect_environment",
    "scan_software",
    "scan_selected_software",
    "software_inventory",
    "profiles",
    "build_install_plan",
    "build_install_plan_for",
    "build_dynamic_install_plan",
    "cancel_task",
    "query_task",
    "get_task_events",
    "run_install",
    "cancel_install",
    "resumable_install",
    "last_install_session",
    "verify_installation",
    "verify_install_result",
    "install_log_path",
    "read_install_log",
    "install_log_exists",
    "planned_config_actions",
    "generate_report",
    "save_report",
    "runtime_status",
    "build_bootstrap_plan",
    "run_bootstrap",
    "cancel_bootstrap",
    "resumable_bootstrap",
    "last_bootstrap",
    "verify_bootstrap",
    "localization_targets",
    "capability_report",
    "profile_capabilities",
    "software_catalogue",
    "machine_facts",
    "explain_software",
    "explained_catalogue",
    "list_goals",
    "environment_plan",
    "environment_plans",
    "advisor_summary",
    "advisor_report_text",
    "concept_notes",
    "knowledge_status",
    "license_status",
    "license_device",
    "activate_license",
    "deactivate_license",
    "plugin_views",
    "plugin_targets",
    "run_plugin",
    "winget_search",
    "winget_show",
    "reveal_in_explorer",
    "open_url",
    "detect_editors",
    "open_in_editor",
    "native_download",
    "get_downloads_dir",
    "verify_file_sha256",
    "load_user_uiparts",
    "save_user_uiparts",
    "get_uiparts_info",
    "save_uipart_asset",
    "stage_uipart_asset",
    "commit_uipart_assets",
    "discard_uipart_assets",
    "read_uipart_asset",
    "delete_uipart_assets",
    "get_storage_policy",
    "set_storage_policy",
    "select_storage_folder",
    "validate_storage_path",
    "clean_download_cache",
]
commands.deny = [
    "execute_native_command",
    "execute_streaming_command",
    "cancel_native_execution",
]

id: lm_studio
name: LM Studio
category: AI 工具
description: 在自己的电脑上离线运行开源大模型的桌面程序。
purpose:
  - 断网也能用 AI（模型下载到本机后不再需要联网）
  - 不用担心对话内容被上传到别人的服务器
  - 尝试不同的开源模型，直观对比效果
relatedCapabilities: []
dependsOn: []
commonlyUsedBy:
  - 对隐私敏感的同学
  - 想研究开源模型的人
studentExplanation: |
  LM Studio 让你把开源大模型下载到自己的电脑上运行。它有一个图形界面，
  可以像应用商店一样搜索和下载模型，点一下就开始对话，不需要敲命令。

  什么时候值得用：
  · 断网了还想用 AI 帮忙（模型已在本地，不需要联网）
  · 处理的内容比较敏感，不想上传到云端服务
  · 想比较不同开源模型的实际表现

  需要提醒的现实问题：本地运行模型对电脑配置要求较高，
  显存（显卡内存）越大能跑的模型越好。普通核显笔记本只能跑较小的模型，
  速度和效果都不如云端服务。装之前可以先看看自己显卡的显存大小。

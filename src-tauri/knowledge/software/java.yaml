studentExplanation: |
  Java 程序的运行方式和 Python 不一样：Python 是解释执行，Java 需要先把
  .java 文件**编译**成 .class 文件再运行。JDK（Java Development Kit）
  就是提供这套编译和运行工具的包。

  如果只装 JRE（运行环境）你只能运行别人做好的程序，写不了自己的代码。
  所以这里装的是 JDK，它包含了编译器和运行时。

  计算机专业的 Java 课程、数据结构课、以及很多企业后端项目都要求先装 JDK。
  装完还需要配置 JAVA_HOME 环境变量，本工具会自动处理。

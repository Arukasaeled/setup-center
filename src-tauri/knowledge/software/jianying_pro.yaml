id: jianying_pro
name: 剪映专业版
category: AI 创作
description: 字节跳动的视频剪辑软件，电脑上剪视频、加字幕、套模板。
purpose:
  - 剪课程汇报视频、社团宣传片
  - 自动识别字幕、一键成片，不用手工打轴
  - 自带素材库与模板，做出来的效果比手工快很多
  - 需要 AI 相关素材时可以用画中画、图文成片等功能
relatedCapabilities: []
dependsOn: []
commonlyUsedBy:
  - 要做课程汇报视频的同学
  - 社团、比赛需要出片的人
studentExplanation: |
  这是国内学生剪视频最常用的工具：手机版和电脑版账号互通，手机上先粗剪、
  电脑上精修，工程文件能接着做。

  和 CapCut 的关系要注意：**CapCut 是同一个软件的海外版**，界面更接近，但素材库
  和部分 AI 功能（比如一些模板、配音）两边不一样。国内使用、要中文素材和
  中文配音的，装剪映；要给海外平台投稿、需要英文模板的，装 CapCut。
  两者可以同时装，并不冲突。

  它不在“AI 编程”这条线上，装不装都不影响写代码。纯粹是课程和社团要出片子时
  才需要。

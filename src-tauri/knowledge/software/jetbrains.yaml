studentExplanation: |
  JetBrains 是一家做 IDE（集成开发环境）的公司，旗下有 IntelliJ IDEA（Java）、
  PyCharm（Python）、WebStorm（前端）等。它们比 VS Code 更"重"，
  但也更懂你的代码：能自动找出潜在的空指针、帮你安全地重命名和重构、
  跳转定义比 VS Code 准。

  什么时候选它：写大型项目、做 Java 课程设计时，它的代码提示和调试器
  能省下不少时间。什么时候用 VS Code 就够：写小脚本、改配置文件、
  或者只是想装一个轻量的编辑器。

  在校学生可以用学校邮箱申请**免费教育授权**，能免费用专业版。
  申请需要你提供学校邮箱，这一步本工具不会替你完成。

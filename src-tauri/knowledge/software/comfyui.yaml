id: comfyui
name: ComfyUI
category: AI 创作
description: 节点式 AI 绘图工作台，把生成图片的每一步连起来，可复现、可改。
purpose:
  - 在本机生成图片，数据不出本机
  - 用节点把“模型 + 提示词 + 后处理”连成流程，随时改其中一步
  - 复用别人分享的工作流文件，不用从零搭
  - 配合本机显卡跑 Stable Diffusion 系列模型
relatedCapabilities:
  - local-model-inference
dependsOn: []
commonlyUsedBy:
  - 做设计作业、需要批量出图的人
  - 想研究生成式模型内部流程的同学
studentExplanation: |
  它和“输入一句话就出图”的网页工具不是一回事：这里要你自己把节点连起来，
  所以第一眼看上去会比较复杂。换来的是**可控**——每一步的参数都能改，
  同一套流程可以反复跑出稳定的结果。

  两个现实条件要先确认：
  1. **显卡**。要用本机模型出图，独立显卡基本是必需的；只有核显会很慢。
     环境检测会告诉你显存大小，低于 6 GB 跑主流模型会比较吃力。
  2. **下载模型**。它自带的工作流只是骨架，模型文件要另外下载，通常几个 GB。
     硬盘要留出空间。

  没有独立显卡、或者只是想快速出图，用在线服务更合适，不必装这个。
versions: []

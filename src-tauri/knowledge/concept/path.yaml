id: path
name: PATH
category: 概念
summary: 环境变量，告诉系统去哪里找可执行程序。
whyItMatters: >
  你在命令行输入 python 时，系统会依次查看 PATH 里列出的目录，找到第一个
  同名的程序。刚安装的软件如果没有加入 PATH，就会出现"明明装了却说找不到命令"。
  这种情况不用重装，重新打开一次终端通常就能解决——因为终端只在启动时读取一次 PATH。
relatedCapabilities:
  - python-development
  - node-development
  - ai-cli-assistant

[package]
name = "ai-student-setup"
version = "0.2.2"
description = "Setup Center - detect, install and configure desktop tools"
authors = ["Setup Center"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_student_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    # DPAPI (`CryptProtectData` / `CryptUnprotectData`) and `BCryptGenRandom`,
    # used by `modules/license` to encrypt the activation file and mint codes.
    # Added rather than pulling in `aes` + `sha2` + `rand`: the OS already
    # provides a stronger primitive than a machine-derived key we would have to
    # ship inside the binary.
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

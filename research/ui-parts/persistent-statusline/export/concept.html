<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Persistent Statusline — Concept Demonstration</title>
  <style>
    body {
      background: #08090d;
      color: #e2e8f0;
      font-family: ui-monospace, Consolas, monospace;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .status-belt {
      width: 760px;
      background: #0d1017;
      border: 1px solid #202738;
      border-radius: 6px;
      overflow: hidden;
      font-size: 11.5px;
    }
    .anchor {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0f131c;
      border-bottom: 1px solid #181f2e;
    }
    .badge {
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .meter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
    }
    .bar {
      width: 70px;
      height: 8px;
      background: #1a2233;
      border-radius: 2px;
      overflow: hidden;
    }
    .fill { height: 100%; background: #10b981; }
    .activity {
      padding: 6px 12px;
      background: #090c12;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #94a3b8;
    }
    .tag {
      background: #161b26;
      border: 1px solid #222b3d;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10.5px;
    }
  </style>
</head>
<body>
  <h2>Persistent Status Belt (Low-Intrusion HUD)</h2>

  <div class="status-belt">
    <div class="anchor">
      <div>
        <span class="badge">[DeepSeek-V3]</span>
        <span class="meter">
          <span>Context</span>
          <span class="bar"><span class="fill" style="width: 68%;"></span></span>
          <span style="color: #10b981; font-weight: bold;">68%</span>
        </span>
        <span style="color: #334155; margin: 0 8px;">│</span>
        <span style="color: #64748b;">8 rules │ 4 MCPs │ git:(main*)</span>
      </div>
      <div class="tag">
        expires <strong style="color: #e2e8f0;">21:45</strong>
      </div>
    </div>
    <div class="activity">
      <div>
        <span style="color: #10b981;">✓</span> Read ×4 <span style="color: #334155;">│</span>
        <span style="color: #10b981;">✓</span> Grep ×2 <span style="color: #334155;">│</span>
        <span style="color: #38bdf8;">◐</span> Edit: types.ts
      </div>
      <div>
        <span style="color: #38bdf8;">◐</span> <strong style="color: #c084fc;">Research Subagent</strong>: Scanning AST tokens (14s)
      </div>
      <div>
        <span style="color: #f59e0b;">▸</span> Current task in progress (2/3)
      </div>
    </div>
  </div>
</body>
</html>
